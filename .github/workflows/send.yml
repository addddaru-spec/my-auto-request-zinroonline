name: Send Room In Request
 
on: 
  workflow_dispatch: 

jobs:
  send_request:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Script
        shell: bash
        run: |
          # 1. パラメータの設定
          RAND_NUM=$(( RANDOM % 1000000 ))
          PLAYER_NAME="ジーザス${RAND_NUM}"
          ROOM_NAME="村名"
          ROM="1"

          # 2. session_key の設定 (1に固定)
          SESSION_KEY=123

          # 3. URLエンコード処理 (Python3を使用)
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$1"
          }

          ENC_PLAYER=$(urlencode "$PLAYER_NAME")
          ENC_ROOM=$(urlencode "$ROOM_NAME")
          ENC_ROM=$(urlencode "$ROM")

          # 4. リクエストURLとクッキーの作成
          FINAL_URL="https://zinro.net/m/room_in.php?mode=submit&player_name=${ENC_PLAYER}&room_name=${ENC_ROOM}&pass=&rom=${ENC_ROM}&speed=1"
          COOKIE="session_key=${SESSION_KEY}"

          echo "Generated Player: $PLAYER_NAME"
          echo "Generated Session Key: $SESSION_KEY"
          echo "Requesting: $FINAL_URL"

          # 5. リクエストの送信
          curl -v -X GET "$FINAL_URL" \
               -H "Cookie: $COOKIE" \
               -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
